[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localgen-mcp"
version = "0.1.0"
description = "Local, offline MCP server for image, video and 3D mesh generation through a shared on-demand ComfyUI backend"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "trimesh==5.2.1",
]

[project.scripts]
localgen-mcp = "localgen_mcp.server:main"
localgen-supervisor = "localgen_mcp.supervisor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localgen_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
